name: Security and quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAB_MODE: disabled
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run security:audit

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          PUBLIC_SHOWCASE: "true"

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare
        env:
          PUBLIC_SHOWCASE: "true"

      - name: Verify Cloudflare free-tier bundle
        run: npm run dry-run:cloudflare

  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LAB_MODE: disabled
      PUBLIC_SHOWCASE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Deploy public showcase
        run: npm run deploy:cloudflare
