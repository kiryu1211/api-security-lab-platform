name: Security and quality

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAB_MODE: disabled
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify repository safety
        run: npm run security:repository

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run security:audit

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          PUBLIC_SHOWCASE: "true"

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare
        env:
          PUBLIC_SHOWCASE: "true"

      - name: Verify Cloudflare free-tier bundle
        run: npm run dry-run:cloudflare

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify public showcase boundary in workerd
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8787
        run: |
          npm run preview:cloudflare:built > "$RUNNER_TEMP/cloudflare-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..60}; do
            if curl --silent --output /dev/null http://127.0.0.1:8787/; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/cloudflare-preview.log"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat "$RUNNER_TEMP/cloudflare-preview.log"
            exit 1
          fi

          node scripts/verify-public-showcase.mjs http://127.0.0.1:8787
          npm run test:e2e

      - name: Store Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Store verified Cloudflare Worker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-cloudflare-worker
          path: .open-next
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAB_MODE: disabled
      PUBLIC_SHOWCASE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download verified Cloudflare Worker
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-cloudflare-worker
          path: .open-next

      - name: Deploy public showcase
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
